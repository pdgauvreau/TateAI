<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06080c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="description" content="TATE AI turns your slides, assignments, and practice exams into conversations. Talk through your coursework and remember more." />
    <title>TATE AI — Learn by Talking</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="TATE AI — Learn by Talking" />
    <meta property="og:description" content="Upload your course materials and talk through them with AI. Study smarter, not harder." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TATE AI — Learn by Talking" />
    <meta name="twitter:description" content="Upload your course materials and talk through them with AI. Study smarter, not harder." />

    <!--
      Resolve the theme before the first paint.

      This has to be inline and blocking: if the choice were applied from React,
      a reader on the light theme would see a flash of the dark default on every
      cold load. The attribute set here is also what useTheme() reads as its
      initial state, so there is exactly one source of truth.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tateai:theme')
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.dataset.theme = theme
        } catch (e) {
          /* private window or blocked storage — the dark default in the markup stands */
        }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
